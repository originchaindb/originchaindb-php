name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "8.2"
          - os: ubuntu-latest
            runtime: "8.4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: "${{ matrix.runtime }}"
          extensions: curl, json
          coverage: none
      - name: Validate package
        run: composer validate --strict
      - name: Install
        run: composer install --no-interaction
      - name: HTTP contract
        run: python tests/contract/run.py -- php tests/consumer.php
      - name: Check example syntax
        run: php -l examples/catalog.php
