name: Live integration

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Nonsecret server deployment/version identifier for this receipt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-integration
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sdk-integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: "8.2"
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction
      - name: Run read-only integration example
        env:
          OC_URL: ${{ secrets.OC_URL }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          OC_DEPLOYMENT: ${{ inputs.deployment }}
        run: python3 scripts/run_live.py -- php examples/integration.php
